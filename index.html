<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-tac-toe</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">
</head>

<body>

    <main>
        <h1>Tic-Tac-Toe Game</h1>
        <p id="subtitle">Let's Start with O</p>
        <div class="container">
            <div class="game">
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
            </div>
        </div>
        <div class="resetBtn">
            <button id="reset">New Game</button>
        </div>
    </main>
    <div class="winingStat">
        <div class="win" id="win">
            <img src="assets/congratulations-7600_256.gif" alt="">
        </div>
        <div class="congrats">
            <p id="congrats"></p>
        </div>
    </div>


    <script src="script.js"></script>
</body>

</html>
